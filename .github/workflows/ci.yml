name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/compose.sh scripts/update-pgdog-version.sh pgdog/generate-config.sh pgdog/entrypoint.sh tests/integration-test.sh

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: |
            README.md
            CHANGELOG.md
            AGENTS.md

  integration-tests:
    name: Integration Tests (${{ matrix.pgdog-target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        pgdog-target: [pinned, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select PgDog image
        run: |
          if [ "${{ matrix.pgdog-target }}" = "pinned" ]; then
            version="$(sed -n 's/^PGDOG_VERSION=//p' versions.env)"
          else
            version="main"
          fi
          echo "PGDOG_IMAGE=ghcr.io/pgdogdev/pgdog:$version" >> "$GITHUB_ENV"

      - name: Set up Docker Compose
        run: docker compose version

      - name: Ensure pgdog dir is writable
        run: mkdir -p pgdog && sudo chown 1000:1000 pgdog

      - name: Run integration tests
        run: ./tests/integration-test.sh

      - name: Upload coverage to Codecov
        if: always() && matrix.pgdog-target == 'pinned'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: integration-tests
          fail_ci_if_error: false
          handle_no_reports_found: true

      - name: Upload test results to Codecov
        if: always() && matrix.pgdog-target == 'pinned'
        run: |
          pip3 install --only-binary :all: 'codecov-cli==11.3.1'
          codecovcli do-upload --report-type test_results --file test-results/junit.xml --token "$CODECOV_TOKEN" || echo "Codecov test-results upload failed (non-fatal)"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f tests/docker-compose.test.yml logs --tail=200 2>/dev/null || true
          docker ps -a 2>/dev/null || true

  pgdog-version:
    name: PgDog version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check latest PgDog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-pgdog-version.sh --check

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Semgrep
        run: "pip3 install --only-binary :all: 'semgrep==1.176.1'"

      - name: Run Semgrep security scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
