name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/compose.sh scripts/update-pgdog-version.sh pgdog/generate-config.sh pgdog/entrypoint.sh tests/integration-test.sh

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: |
            README.md
            CHANGELOG.md
            AGENTS.md

  integration-tests:
    name: Integration Tests (${{ matrix.pgdog-target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    strategy:
      matrix:
        pgdog-target: [pinned, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select PgDog image
        run: |
          if [ "${{ matrix.pgdog-target }}" = "pinned" ]; then
            version="$(sed -n 's/^PGDOG_VERSION=//p' versions.env)"
          else
            version="main"
          fi
          echo "PGDOG_IMAGE=ghcr.io/pgdogdev/pgdog:$version" >> "$GITHUB_ENV"

      - name: Set up Docker Compose
        run: docker compose version

      - name: Ensure pgdog dir is writable
        run: mkdir -p pgdog && sudo chown 1000:1000 pgdog

      - name: Run integration tests
        run: ./tests/integration-test.sh

      - name: Upload coverage to Codecov
        if: always() && matrix.pgdog-target == 'pinned'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          directory: ./coverage
          use_oidc: true
          flags: integration-tests
          fail_ci_if_error: false
          handle_no_reports_found: true

      - name: Upload test results to Codecov
        if: always() && matrix.pgdog-target == 'pinned'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          report_type: test_results
          use_oidc: true
          files: ./test-results/junit.xml
          flags: integration-tests
          fail_ci_if_error: false
          handle_no_reports_found: true

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: integration-tests-${{ matrix.pgdog-target }}
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f tests/docker-compose.test.yml logs --tail=200 2>/dev/null || true
          docker ps -a 2>/dev/null || true

  pgdog-version:
    name: PgDog version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check latest PgDog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-pgdog-version.sh --check

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Semgrep security scan
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
